<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2d5a27">
  <meta name="description" content="Realms of Clickoria - A mobile-first clicker RPG">
  <title>Realms of Clickoria</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="game-container">

    <!-- Header -->
    <header class="game-header">
      <span class="game-header__zone" id="zone-name">Whisperwood Glen</span>
      <div class="game-header__right">
        <span class="game-header__gold">&#x1F4B0; <span id="gold-display">0</span></span>
        <button class="game-header__stats-btn" id="header-stats-btn" aria-label="View stats">&#x2139;&#xFE0F;</button>
        <span class="game-header__level" id="level-display">Lv. 1</span>
      </div>
    </header>

    <!-- Combat Screen -->
    <main class="combat-screen" id="combat-screen">

      <!-- Monster Area (tappable) -->
      <div class="monster-area" id="monster-area" role="button" tabindex="0" aria-label="Attack monster">

        <!-- Player Overlay Bars (HP, Shield, Energy) -->
        <div class="player-overlay-bars" id="player-overlay-bars">
          <div class="player-overlay-bar player-overlay-bar--hp">
            <div class="player-overlay-bar__fill hp-fill" id="player-hp-fill" style="width: 100%"></div>
          </div>
          <div class="player-overlay-bar player-overlay-bar--shield" id="player-shield-bar" style="display: none;">
            <div class="player-overlay-bar__fill player-shield-fill" id="player-shield-fill" style="width: 0%"></div>
          </div>
          <div class="player-overlay-bar player-overlay-bar--energy">
            <div class="player-overlay-bar__fill energy-fill" id="energy-fill" style="width: 0%"></div>
          </div>
        </div>

        <!-- Type Badge -->
        <div class="monster-type-badge" id="monster-type-badge" style="display: none;"></div>

        <!-- Boss Timer (enrage countdown) -->
        <div class="boss-timer" id="boss-timer" style="display: none;">
          <div class="boss-timer__label">
            <span class="boss-timer__icon">&#x23F1;&#xFE0F;</span>
            <span class="boss-timer__text" id="boss-timer-text">0:00</span>
          </div>
          <div class="progress-bar progress-bar--sm">
            <div class="progress-bar__fill boss-timer-fill" id="boss-timer-fill" style="width: 100%"></div>
          </div>
        </div>

        <!-- Escape Timer (swift) -->
        <div class="monster-escape-timer" id="monster-escape-timer" style="display: none;">
          <span class="monster-escape-timer__icon">&#x23F1;&#xFE0F;</span>
          <span class="monster-escape-timer__text" id="escape-timer-text">8.0s</span>
        </div>

        <!-- Boss Badge (floating) -->
        <div class="boss-badge" id="boss-challenge" style="display: none;">
          <div class="boss-badge__progress" id="boss-kill-progress" style="display: none;">
            <span class="boss-badge__progress-text"></span>
          </div>
          <button class="boss-badge__btn" id="boss-challenge-btn" aria-label="Challenge boss">&#x1F480; BOSS</button>
        </div>

        <div class="monster-display">
          <span class="monster-display__emoji" id="monster-emoji">...</span>
          <div class="monster-display__name" id="monster-name">Loading...</div>
        </div>

        <!-- Monster Shield Bar (shielded type) -->
        <div class="monster-shield" id="monster-shield" style="display: none;">
          <div class="progress-bar" id="monster-shield-bar">
            <div class="progress-bar__fill shield-fill" id="monster-shield-fill" style="width: 100%"></div>
          </div>
        </div>

        <!-- Monster HP Bar -->
        <div class="monster-hp">
          <div class="progress-bar" id="monster-hp-bar">
            <div class="progress-bar__fill hp-fill" id="monster-hp-fill" style="width: 100%"></div>
          </div>
        </div>

        <!-- Monster Status Effects -->
        <div class="status-effects-row" id="monster-status-effects"></div>

        <!-- Floating Damage Numbers -->
        <div class="damage-container" id="damage-container"></div>

        <!-- Player Status Effects (overlay) -->
        <div class="status-effects-row status-effects-row--player-overlay" id="player-status-effects"></div>

        <!-- Buff & Hit Modifier Indicators (overlay) -->
        <div class="buff-row buff-row--overlay" id="buff-row"></div>
      </div>


      <!-- Skill Bar (4 active skill slots) -->
      <div class="skill-bar" id="skill-bar">
        <button class="skill-btn skill-btn--empty" id="skill-slot-0"></button>
        <button class="skill-btn skill-btn--empty" id="skill-slot-1"></button>
        <button class="skill-btn skill-btn--empty" id="skill-slot-2"></button>
        <button class="skill-btn skill-btn--empty" id="skill-slot-3"></button>
        <div class="passive-indicator-row" id="passive-indicator-row"></div>
      </div>

      <!-- XP Strip -->
      <div class="xp-strip"><div class="xp-strip__fill" id="xp-fill" style="width: 0%"></div></div>

    </main>

    <!-- Shop Screen -->
    <section class="shop-screen" id="shop-screen" style="display: none;">

      <!-- Shop Header -->
      <div class="shop-header">
        <button class="shop-header__back" id="shop-back-btn">&#x2190;</button>
        <span class="shop-header__title">Shop</span>
        <span class="shop-header__gold">&#x1F4B0; <span id="shop-gold-display">0</span></span>
      </div>

      <!-- Tabs -->
      <div class="shop-tabs">
        <button class="shop-tab shop-tab--active" data-tab="shop">Shop</button>
        <button class="shop-tab" data-tab="inventory">Inventory</button>
      </div>

      <!-- Shop Content -->
      <div class="shop-content" id="shop-content"></div>

      <!-- Inventory Content -->
      <div class="inventory-content" id="inventory-content" style="display: none;"></div>

    </section>

    <!-- Zones Screen -->
    <section class="zones-screen" id="zones-screen" style="display: none;">
      <div class="zones-header">
        <button class="zones-header__back" id="zones-back-btn">&#x2190;</button>
        <span class="zones-header__title">Zones</span>
        <span class="zones-header__spacer"></span>
      </div>
      <div class="zones-list" id="zones-list"></div>
    </section>

    <!-- Skills Screen -->
    <section class="skills-screen" id="skills-screen" style="display: none;">
      <div class="skills-header">
        <button class="skills-header__back" id="skills-back-btn">&#x2190;</button>
        <span class="skills-header__title">Skills</span>
        <span class="skills-header__sp" id="skills-sp-display">SP: 0</span>
      </div>
      <div class="skills-tabs">
        <button class="skills-tab skills-tab--active" data-tab="active">Active</button>
        <button class="skills-tab" data-tab="passive">Passive</button>
      </div>
      <div class="skills-equipped" id="skills-equipped"></div>
      <div class="skills-list" id="skills-list"></div>
    </section>

    <!-- Item Detail Panel -->
    <div class="item-detail-backdrop" id="item-detail-backdrop" style="display: none;">
      <div class="item-detail-panel modal-panel" id="item-detail-panel"></div>
    </div>

    <!-- Stats Panel Overlay -->
    <div class="stats-panel-backdrop" id="stats-panel-backdrop" style="display: none;">
      <div class="stats-panel modal-panel" id="stats-panel"></div>
    </div>

    <!-- Boss Modal -->
    <div class="boss-modal-backdrop" id="boss-modal-backdrop" style="display: none;">
      <div class="boss-modal" id="boss-modal"></div>
    </div>

    <!-- Tutorial Modal (blocking) -->
    <div class="tutorial-modal-backdrop" id="tutorial-modal-backdrop" style="display: none;">
      <div class="tutorial-modal" id="tutorial-modal"></div>
    </div>

    <!-- Shared Navigation -->
    <nav class="game-nav">
      <button class="nav-btn nav-btn--active" data-screen="combat">
        <span class="nav-btn__icon">&#x2694;&#xFE0F;</span>
        <span>Combat</span>
      </button>
      <button class="nav-btn" data-screen="shop">
        <span class="nav-btn__icon">&#x1F6D2;</span>
        <span>Shop</span>
      </button>
      <button class="nav-btn" data-screen="skills">
        <span class="nav-btn__icon">&#x2B50;</span>
        <span>Skills</span>
      </button>
      <button class="nav-btn" data-screen="zones">
        <span class="nav-btn__icon">&#x1F5FA;&#xFE0F;</span>
        <span>Zones</span>
      </button>
    </nav>

    <!-- Tutorial Overlay -->
    <div class="tutorial-overlay" id="tutorial-overlay" style="display: none;">
      <div class="tutorial-welcome">
        <div class="tutorial-welcome__title">Realms of Clickoria</div>
        <div class="tutorial-welcome__subtitle">A world of monsters awaits...</div>
        <div class="tutorial-welcome__prompt">Tap anywhere to begin</div>
      </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toast-container" aria-live="polite"></div>

  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
