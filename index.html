<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2d5a27">
  <meta name="description" content="Realms of Clickoria - A mobile-first clicker RPG">
  <title>Realms of Clickoria</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="game-container">

    <!-- Header -->
    <header class="game-header">
      <span class="game-header__zone" id="zone-name">Whisperwood Glen</span>
      <span class="game-header__level" id="level-display">Lv. 1</span>
    </header>

    <!-- Combat Screen -->
    <main class="combat-screen" id="combat-screen">

      <!-- Monster Area (tappable) -->
      <div class="monster-area" id="monster-area" role="button" tabindex="0" aria-label="Attack monster">

        <!-- Type Badge -->
        <div class="monster-type-badge" id="monster-type-badge" style="display: none;"></div>

        <!-- Escape Timer (swift) -->
        <div class="monster-escape-timer" id="monster-escape-timer" style="display: none;">
          <span class="monster-escape-timer__icon">&#x23F1;&#xFE0F;</span>
          <span class="monster-escape-timer__text" id="escape-timer-text">8.0s</span>
        </div>

        <div class="monster-display">
          <span class="monster-display__emoji" id="monster-emoji">...</span>
          <div class="monster-display__name" id="monster-name">Loading...</div>
          <div class="monster-display__level" id="monster-level"></div>
        </div>

        <!-- Monster Shield Bar (shielded type) -->
        <div class="monster-shield" id="monster-shield" style="display: none;">
          <div class="progress-bar" id="monster-shield-bar">
            <div class="progress-bar__fill shield-fill" id="monster-shield-fill" style="width: 100%"></div>
          </div>
          <div class="monster-shield__text" id="monster-shield-text">0 / 0</div>
        </div>

        <!-- Monster HP Bar -->
        <div class="monster-hp">
          <div class="progress-bar" id="monster-hp-bar">
            <div class="progress-bar__fill hp-fill" id="monster-hp-fill" style="width: 100%"></div>
          </div>
          <div class="monster-hp__text" id="monster-hp-text">0 / 0</div>
        </div>

        <!-- Floating Damage Numbers -->
        <div class="damage-container" id="damage-container"></div>
      </div>

      <!-- Player Resource Bars -->
      <div class="player-bars">
        <div class="player-bar">
          <span class="player-bar__icon">&#x2764;&#xFE0F;</span>
          <div class="progress-bar">
            <div class="progress-bar__fill hp-fill" id="player-hp-fill" style="width: 100%"></div>
          </div>
          <span class="player-bar__text" id="player-hp-text">100 / 100</span>
        </div>
        <div class="player-bar">
          <span class="player-bar__icon">&#x26A1;</span>
          <div class="progress-bar">
            <div class="progress-bar__fill energy-fill" id="energy-fill" style="width: 0%"></div>
          </div>
          <span class="player-bar__text" id="energy-text">0 / 100</span>
        </div>
      </div>

      <!-- Bottom Section -->
      <div class="bottom-section">

        <!-- Stats Bar -->
        <div class="stats-bar">
          <div class="stat-item">
            <span class="stat-item__icon">&#x2694;&#xFE0F;</span>
            <span class="stat-item__value" id="attack-display">5</span>
          </div>
          <div class="stat-item">
            <span class="stat-item__icon">&#x1F4B0;</span>
            <span class="stat-item__value stat-item__value--gold" id="gold-display">0</span>
          </div>
        </div>

        <!-- XP Bar -->
        <div class="xp-section">
          <div class="xp-label">
            <span>XP</span>
            <span id="xp-text">0 / 100</span>
          </div>
          <div class="progress-bar progress-bar--sm">
            <div class="progress-bar__fill xp-fill" id="xp-fill" style="width: 0%"></div>
          </div>
        </div>

      </div>

    </main>

    <!-- Shop Screen -->
    <section class="shop-screen" id="shop-screen" style="display: none;">

      <!-- Shop Header -->
      <div class="shop-header">
        <button class="shop-header__back" id="shop-back-btn">&#x2190;</button>
        <span class="shop-header__title">Shop</span>
        <span class="shop-header__gold">&#x1F4B0; <span id="shop-gold-display">0</span></span>
      </div>

      <!-- Tabs -->
      <div class="shop-tabs">
        <button class="shop-tab shop-tab--active" data-tab="shop">Shop</button>
        <button class="shop-tab" data-tab="inventory">Inventory</button>
      </div>

      <!-- Shop Content -->
      <div class="shop-content" id="shop-content"></div>

      <!-- Inventory Content -->
      <div class="inventory-content" id="inventory-content" style="display: none;"></div>

    </section>

    <!-- Shared Navigation -->
    <nav class="game-nav">
      <button class="nav-btn nav-btn--active" data-screen="combat">
        <span class="nav-btn__icon">&#x2694;&#xFE0F;</span>
        <span>Combat</span>
      </button>
      <button class="nav-btn" data-screen="shop">
        <span class="nav-btn__icon">&#x1F6D2;</span>
        <span>Shop</span>
      </button>
      <button class="nav-btn" data-screen="skills" disabled>
        <span class="nav-btn__icon">&#x2B50;</span>
        <span>Skills</span>
      </button>
      <button class="nav-btn" data-screen="zones" disabled>
        <span class="nav-btn__icon">&#x1F5FA;&#xFE0F;</span>
        <span>Zones</span>
      </button>
    </nav>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toast-container" aria-live="polite"></div>

  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
